name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Setup Flutter Skeleton & Android Files
        run: |
          mkdir -p temp_app
          cd temp_app
          flutter create --org ir.dadban --project-name dadban .
          cp -rn android ..
          cd ..
          rm -rf temp_app

      - name: Create Clean pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: dadban
          description: A complete lawyer assistance application
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            cupertino_icons: ^1.0.8
            path_provider: ^2.1.3
            permission_handler: ^11.3.1
            record: ^5.1.2
            just_audio: ^0.9.39
            speech_to_text: ^6.6.2
            google_mlkit_text_recognition: ^0.13.0
            table_calendar: ^3.1.2
            shamsi_date: ^1.0.4
            flutter_riverpod: ^2.5.1
            dio: ^5.4.3+1
            google_sign_in: ^6.2.1
            flutter_local_notifications: ^17.2.1
            image_picker: ^1.1.2
            http: ^1.2.1
            path: ^1.9.0

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
          EOF

      - name: Auto-fix Dart Source Code
        run: |
          # 1. حذف خطوط part '*.g.dart' از مدل‌ها تا خطای نبود فایل ندهد
          find lib/ -name "*.dart" -exec sed -i '/part.*\.g\.dart/d' {} +
          find lib/ -name "*.dart" -exec sed -i '/@collection/d' {} +
          find lib/ -name "*.dart" -exec sed -i '/@Collection()/d' {} +
          find lib/ -name "*.dart" -exec sed -i '/package:isar\/isar\.dart/d' {} +

          # 2. اصلاح خطاهای ویجت تقویم
          if [ -f "lib/ui/calendar_screen.dart" ]; then
            sed -i '/daysOfWeekLabels:/d' lib/ui/calendar_screen.dart
            sed -i '/monthNames:/d' lib/ui/calendar_screen.dart
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dadban-App
          path: build/app/outputs/flutter-apk/app-release.apk
